<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Runs before the page paints, so there's no flash of the wrong
    // theme: if the visitor picked dark mode before, apply it immediately.
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  <title>About — Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="site-title">Your Name</a>
      <div class="header-right">
        <button class="theme-toggle" aria-label="Switch to dark mode">🌙</button>
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle menu">Menu</button>

        <nav class="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="diary.html">Site Diary</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="case-study.html">Case Study</a></li>
          <li><a href="about.html" class="active">About</a></li>
        </ul>
        </nav>
      </div>
    </div>
  </header>

  <section class="about-page">
    <div class="wrap">
      <img src="images/profile.jpg" alt="Your Name" class="about-photo" />
      <h1>About</h1>
      <p>A paragraph about who you are.</p>
      <p>A paragraph about what you work on and why.</p>
      <p>How to reach you: <a href="mailto:you@example.com">you@example.com</a></p>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap"><p>&copy; 2026 Your Name.</p></div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
